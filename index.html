<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yum yum gim me sum!</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/main.js" type="module"></script>
</head>
<body>

    <div class="app-container">

    <header class="kundvagn-header">
        <div class="kundvagn-container">
            <img id="kundvagnKnapp" class="kundvagn" src="img/kundvagn.png">
            <span id="kund-count" class="kund-badge">0</span>
        </div>
    </header>

<section id="menyVy" class="vy">

    <h1 class="menytitel">Meny</h1>

    <div class="wonton-container menu-section">
    </div>

    <h2 id="dip-title" class="kategori-titel">Dipsås</h2>
    <div class="dip-container menu-section">
    </div>

    <h2 id="drink-title" class="kategori-titel">Dryck</h2>
    <div class="drink-container menu-section">
    </div>

</section>

<section id="cartVy" class="vy hidden">

    <p id="empty-cart-msg" class="hidden">
        Du har inte valt något
    </p>

    <div class="cart-items"></div>

    <div class="cart-total">
        <span>TOTALT<br><small>inkl 20% moms</small></span>
        <strong><span id="cart-total-price">0</span> SEK</strong>
    </div>

    <button class="checkout-btn">
        TAKE MY MONEY!
    </button>

        <button id="backToMenuBtn" class="secondary-btn">
             ← Tillbaka till meny
        </button>

</section>


<section id="orderVy" class="vy hidden">

    <div class="order-content">
        <img src="img/yygs.png" alt="Food box" class="order-image">

        <h1>DINA WONTONS</h1>
        <h1>TILLAGAS!</h1>
        <p class="order-time">ETA 5 MIN</p>
        <p class="order-id">#4KJWSDf2</p>

        <button id="receiptBtn" class="secondary-btn">SE KVITTO</button>
        <button id="newOrderBtn" class="primary-btn">GÖR EN NY BESTÄLLNING</button>
    </div>

</section>

<section id="receiptVy" class="vy hidden">
  <div class="receipt">
    <img src="img/yygs.png" class="receipt-logo" />

    <h2>KVITTO</h2>
    <p class="order-id">#4KJWSDf2</p>

    <div class="receipt-items"></div>

    <div class="receipt-total">
      <span>TOTALT<br><small>inkl 20% moms</small></span>
      <strong><span id="receipt-total-price">0</span> SEK</strong>
    </div>

    <button id="receiptNewOrder" class="primary-btn">
      GÖR EN NY BESTÄLLNING
    </button>
  </div>
</section>

</div>
</body>
</html>
